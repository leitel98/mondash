name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[gif]"
      - run: python -m unittest discover -s mon/tests -t . -v
      - name: commands resolve
        run: |
          mondash --version
          cpumon --options
          mondash --doctor

# Publishes to PyPI on a tag. Setup, once: add a "trusted publisher" on pypi.org for this repository
# (project mondash, workflow pypi.yml, environment pypi), then set the repository variable PYPI_PUBLISH=true
# (Settings → Secrets and variables → Actions → Variables). Until then the job is skipped.
name: pypi
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  publish:
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
